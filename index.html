<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services</title>
<style>
/* White page, one grey surface, one grey for secondary text, black. No lines, no capitals.
   12 columns. Column 1 to 3: section names. Column 4 to 8: labels. Column 9 to 12: values.
   A grey surface always means: you can enter or choose something here. Plain text was read from the model. */
:root { --ink: #000; --dim: #8a8a8a; --surface: #f4f4f2; --g: 24px; }
* { box-sizing: border-box; }
html { overflow-y: scroll; }
html, body { margin: 0; background: #fff; color: var(--ink); font-family: "DIN 1451 Std", "DIN 1451 Mittelschrift", "DIN Alternate", "Univers LT Std", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; line-height: 1.3; }
button, input, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; border-radius: 0; }
button { cursor: pointer; text-align: left; }
input, select { outline: 0; min-width: 0; -webkit-appearance: none; appearance: none; }
input::placeholder { color: var(--dim); }
.page { max-width: 1120px; margin: 0 auto; padding: 32px 24px 80px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g); }
.dim { color: var(--dim); }
.small { font-size: 14px; }
header { padding-bottom: 56px; align-items: baseline; }
header .brand { grid-column: 1 / span 3; }
header nav { grid-column: 4 / span 9; display: flex; gap: 0 40px; }
header nav a { color: var(--dim); text-decoration: none; white-space: nowrap; }
header nav a.on { color: var(--ink); }
.head { align-items: start; min-height: 132px; }
.head h1 { grid-column: 4 / span 5; margin: 0; font-size: 56px; line-height: 1; font-weight: 400; }
.head p { grid-column: 9 / span 4; margin: 0; padding-top: 6px; font-size: 14px; color: var(--dim); }
.block { padding-bottom: 44px; }
.sec { grid-column: 1 / span 3; grid-row: 1 / span 40; padding-top: 12px; }
.sec span { display: block; }
.row { display: contents; }
.row .l, .row .v { min-height: 46px; display: flex; align-items: center; margin-bottom: 4px; }
.row .l { grid-column: 4 / span 5; gap: 14px; align-self: start; }
.row .l, .row .v { height: 46px; white-space: nowrap; overflow: hidden; }
.row .v { grid-column: 9 / span 4; padding: 0 14px; align-self: start; }
.row .v > span:first-child > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.row .v.stack { flex-direction: column; align-items: flex-start; justify-content: center; padding-top: 10px; padding-bottom: 10px; height: auto; white-space: normal; }
.row .v.stack > span:first-child { align-items: flex-start; }
.row.in .v { background: var(--surface); }
.row .l.withsug { grid-row: span 2; }
.row .l { height: auto !important; white-space: normal !important; padding: 12px 0; line-height: 1.25; min-height: 46px; }
.sug { grid-column: 9 / span 4; align-self: start; display: flex; flex-wrap: nowrap; align-items: baseline; gap: 14px; padding: 0 14px; margin: -2px 0 8px; white-space: nowrap; overflow: hidden; }
.row .go { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.sug button { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.sug button .dim { text-decoration: none; }
.sug .pick { display: inline-flex; align-items: baseline; gap: 6px; }
.sug .pick > button:first-child { text-decoration: none; font-weight: 500; }
.sug .pick .x { text-decoration: none; color: var(--dim); align-self: center; display: inline-flex; }
.sug .pick .x:hover { color: var(--ink); }
.row.off .l, .row.off .v { color: var(--dim); }
.v input, .v select { flex: 1; align-self: stretch; }
.v select { cursor: pointer; }
.v input.unit { flex: 0 0 72px; margin-left: 8px; }
.v .u { margin-left: 8px; white-space: nowrap; }
.edit { margin-left: auto; padding-left: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.edit button { color: inherit; }
.chk { flex: none; }
.own { background: var(--surface); align-self: stretch; flex: 1; display: flex; align-items: center; padding: 0 10px; margin-left: -10px; }
.own input { flex: 1; align-self: stretch; }
.plus { width: 16px; flex: none; display: flex; justify-content: center; }
.fill { grid-column: 4 / span 9; }
.drop { background: var(--surface); min-height: 110px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 4px; width: 100%; }
.drop b { font-size: 32px; font-weight: 400; }
.drop.on { background: var(--ink); color: #fff; }
.drop.on .dim { color: #fff; }
.imgs { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); column-gap: var(--g); }
.overview { grid-column: 1 / span 9; display: flex; flex-direction: column; margin-bottom: var(--g); }
.overview .im { aspect-ratio: 2.2 / 1; }
.overview .im { flex: 1; min-height: 0; }
.pictos { grid-column: 1 / span 9; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--g); }
.pic .im { aspect-ratio: 1.25 / 1; }
.imgs .im svg { width: 100%; height: 100%; display: block; }
.im svg { width: 100%; height: 100%; display: block; }
.cap { padding-top: 6px; }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--g); }
.thumb { aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--surface); position: relative; }
.thumb .sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.seg { grid-column: 9 / span 4; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 4px; margin-bottom: 4px; }
.seg button { min-height: 46px; display: flex; align-items: center; padding: 0 14px; background: var(--surface); }
.seg button.on { background: var(--ink); color: #fff; }
.btn { grid-column: 9 / span 4; min-height: 46px; display: flex; align-items: center; padding: 0 14px; background: var(--ink); color: #fff; margin-bottom: 4px; }
.btn.light { background: var(--surface); color: var(--ink); }
.note { grid-column: 4 / span 5; margin: 0; align-self: center; color: var(--dim); font-size: 14px; }
.block > .note { align-self: start; padding-top: 12px; } /* on the line of the section title, like a row */
#print { display: none; }
.x { display: inline-flex; align-items: center; color: var(--dim); }
.x:hover { color: var(--ink); }
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: 46vw; background: var(--surface); display: flex; flex-direction: column; }
#panel[hidden] { display: none; }
#panel .bar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 14px; }
#pages { flex: 1; min-height: 0; overflow: auto; padding: 0 14px 14px; }
#pages p { font-size: 14px; margin: 8px 0; }
#pages .pg { background: #fff; margin: 0 auto 10px; position: relative; }
#pages .hl { position: absolute; background: rgba(255, 210, 0, 0.45); mix-blend-mode: multiply; pointer-events: none; }
#pages canvas { display: block; width: 100%; height: auto; }
#panel .tools { display: flex; align-items: center; gap: 16px; flex: none; }
#panel .tools button { font-size: 18px; line-height: 1; color: var(--dim); }
#panel .tools button:hover { color: var(--ink); }
#panel .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
#panel .find { padding: 0 14px 8px; flex: none; }
#panel .find input { width: 100%; height: 38px; background: #fff; padding: 0 10px; font-size: 14px; }
#hits { flex: none; max-height: 34vh; overflow-y: auto; font-size: 13px; padding: 0 14px; }
#hits:not(:empty) { padding-bottom: 8px; }
#hits p { margin: 0 0 6px; }
#hits button { display: grid; grid-template-columns: 44px 1fr; gap: 8px; width: 100%; padding: 5px 0; line-height: 1.35; }
#hits button:hover { color: var(--ink); background: #e2e2df; }
body.split .page { max-width: none; margin: 0 46vw 0 0; }
body.split .row .l { height: auto; min-height: 46px; white-space: normal; padding: 6px 0; }
/* next to the report the page is narrow: the values get one column more, long values wrap instead of being cut */
body.split .row .l, body.split .note, body.split .head h1 { grid-column: 4 / span 4; }
body.split .row .v, body.split .sug, body.split .head p, body.split .btn { grid-column: 8 / span 5; }
body.split .row .v { height: auto; min-height: 46px; white-space: normal; }
@media (max-width: 760px) { header nav { gap: 0 18px; flex-wrap: wrap; } .row .l.withsug { grid-row: auto; } #panel { width: 100vw; left: 0; } body.split .page { margin: 0 auto; } .grid > *, .row .l, .row .v, .sug, .seg, .btn, .note { grid-column: 1 / -1 !important; } .sec { grid-row: auto; padding-bottom: 8px; } .head h1 { font-size: 44px; } }
@media print {
  #panel { display: none !important; }
  @page { size: 1280px 720px; margin: 0; }
  html { overflow: visible; }
  .page { display: none; }
  #print { display: block; }
  #print .sheet { page-break-after: always; break-after: page; }
}
  body.video .hl { background: rgba(255,200,0,.75); box-shadow: 0 0 0 2px rgba(255,200,0,.75); }
  .ring { position: fixed; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1.5px solid #000; border-radius: 50%; pointer-events: none; z-index: 99; animation: ring .6s ease-out forwards; }
  @keyframes ring { from { transform: scale(.3); opacity: .7 } to { transform: scale(1.4); opacity: 0 } }
</style>
<style id="doc-css"></style>
</head>
<body>
<div class="page">
  <header class="grid">
    <span class="brand">Services</span>
    <nav aria-label="Steps">
      <a href="#files" data-s="files">1 Files</a><a href="#data" data-s="data">2 Data</a><a href="#images" data-s="images">3 Images</a><a href="#export" data-s="export">4 Export</a>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="panel" hidden></div>
<div id="print" class="doc"></div>
<input id="file" type="file" accept=".ifc,.pdf" multiple hidden>
<script type="module" src="./app.js?v=fd51118"></script>
</body>
</html>
